          script: |
            cd /home/ubuntu/healthcare-booking

            sudo apt update
            sudo apt install python3-pip python3-venv -y

            git pull origin main

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install -r requirements.txt
            pip install gunicorn

            if [ ! -f /etc/systemd/system/healthcare.service ]; then
              sudo tee /etc/systemd/system/healthcare.service > /dev/null <<EOF
            [Unit]
            Description=Healthcare Flask App
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu/healthcare-booking
            Environment="PATH=/home/ubuntu/healthcare-booking/venv/bin"
            ExecStart=/home/ubuntu/healthcare-booking/venv/bin/gunicorn -w 3 -b 0.0.0.0:5000 app:app
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF
            fi

            sudo systemctl daemon-reload
            sudo systemctl enable healthcare
            sudo systemctl restart healthcare
            sudo systemctl status healthcare --no-pager